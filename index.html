<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Cricket Player 2</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/controls.min.css"
      crossorigin="anonymous">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/shaka-player.ui.min.js"
        crossorigin="anonymous"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:sans-serif;
}

#wrap{
  position:absolute;
  inset:0;
}

#video{
  width:100%;
  height:100%;
}

.shaka-spinner-container{
  display:none!important;
}

/* LOADER */

#loader{
  position:fixed;
  inset:0;
  background:#000;
  z-index:999;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  transition:opacity .4s;
}

#loader.gone{
  opacity:0;
  pointer-events:none;
}

#ring{
  width:42px;
  height:42px;
  border:3px solid rgba(232,255,71,.12);
  border-top-color:#e8ff47;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

#llbl{
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
  color:rgba(255,255,255,.25);
}
</style>
</head>

<body>

<div id="wrap" data-shaka-player-container>
  <video autoplay playsinline data-shaka-player id="video"></video>
</div>

<div id="loader">
  <div id="ring"></div>
  <div id="llbl">LOADING STREAM</div>
</div>

<script>
document.addEventListener('shaka-ui-loaded', initPlayer);

async function initPlayer(){

  const video = document.getElementById('video');
  const player = video.ui.getControls().getPlayer();

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if(!id){
    document.getElementById('llbl').textContent = "NO STREAM ID";
    return;
  }

  try{

    // FETCH CHANNEL FROM API
    const res = await fetch(
      "https://speedverse.playsportsapi.workers.dev/?id=" + encodeURIComponent(id)
    );

    const stream = await res.json();

    if(!stream.url){
      document.getElementById('llbl').textContent = "STREAM NOT FOUND";
      return;
    }

    // DRM CLEARKEY CONFIG
    player.configure({
      drm:{
        clearKeys:{
          [stream.k1]: stream.k2
        }
      }
    });

    // LOAD STREAM
    await player.load(stream.url);

    // HIDE LOADER
    document.getElementById('loader').classList.add('gone');

    console.log("Loaded:", stream.name);

  }catch(e){

    console.error(e);

    document.getElementById('llbl').textContent =
      "STREAM FAILED";

    document.getElementById('loader').classList.add('gone');
  }
}

// WAKE LOCK
if('wakeLock' in navigator){
  navigator.wakeLock.request('screen').catch(()=>{});
}
</script>

</body>
</html>
